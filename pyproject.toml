# Tool configuration only; the skill is installed by copying skills/screenshot-to-qml (see README).

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["evals/cases"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["probe", "diff", "render", "quality_gate", "check", "scaffold", "conftest", "build_cpp", "deploy", "match", "font_match", "fontlib", "icon_match", "shadow_fit", "gradient_fit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
