<script>
// dial geometry: center (262, 262) in each 524 px dial; 270° sweep from 135° (bottom left) clockwise
(function () {
  const NS = "http://www.w3.org/2000/svg", C = 262, A0 = 135, SWEEP = 270;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const pt = (r, a) => [C + r * Math.cos(a * Math.PI / 180), C + r * Math.sin(a * Math.PI / 180)];
  const f = v => Math.round(v * 100) / 100;
  const arc = (r, a0, a1) => {
    const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1);
    return `M ${f(x0)} ${f(y0)} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f(x1)} ${f(y1)}`;
  };
  const el = (svg, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
  function dial(svg, scaleBox, opts) {
    el(svg, "circle", {cx: C, cy: C, r: 261, fill: css("--color-face"), stroke: css("--color-face-border"), "stroke-width": 2, "data-node": opts.id + "Face"});
    el(svg, "circle", {cx: C, cy: C, r: 140, fill: css("--color-hub"), stroke: css("--color-hub-border"), "stroke-width": 2, "data-node": opts.id + "Hub"});
    el(svg, "path", {d: arc(236, A0, A0 + SWEEP), fill: "none", stroke: css("--color-track"), "stroke-width": 18, "stroke-linecap": "butt", "data-node": opts.id + "Track"});
    if (opts.redline != null) {
      const a = A0 + SWEEP * opts.redline / opts.max;
      el(svg, "path", {d: arc(236, a, A0 + SWEEP), fill: "none", stroke: css("--color-redline"), "stroke-width": 18, "data-node": opts.id + "Redline"});
    }
    const av = A0 + SWEEP * opts.value / opts.max;
    el(svg, "path", {d: arc(236, A0, av), fill: "none", stroke: css("--color-accent"), "stroke-width": 18, "stroke-linecap": "butt",
                     "data-node": opts.id + "Arc", "data-value": f(opts.value / opts.max)});
    for (let v = 0; v <= opts.max + 1e-9; v += opts.minor) {
      const major = Math.abs(v / opts.major - Math.round(v / opts.major)) < 1e-6;
      const a = A0 + SWEEP * v / opts.max;
      const [x0, y0] = pt(212, a), [x1, y1] = pt(major ? 192 : 200, a);
      const red = opts.redline != null && v >= opts.redline - 1e-9;
      el(svg, "line", {x1: f(x0), y1: f(y0), x2: f(x1), y2: f(y1), "stroke-width": 3, "stroke-linecap": "round",
                       stroke: red ? css("--color-danger") : css(major ? "--color-tick-major" : "--color-tick")});
      if (major) {
        const [lx, ly] = pt(166, a);
        const d = document.createElement("div");
        d.className = "lbl-num tnum" + (red ? " red" : "");
        d.dataset.node = opts.id + "Label";
        d.style.left = f(lx) + "px"; d.style.top = f(ly) + "px";
        d.textContent = String(Math.round(v / opts.labelStep));
        scaleBox.appendChild(d);
      }
    }
    const [x0, y0] = pt(214, av), [x1, y1] = pt(258, av);
    el(svg, "line", {x1: f(x0), y1: f(y0), x2: f(x1), y2: f(y1), stroke: css("--color-text"), "stroke-width": 6, "stroke-linecap": "round", "data-node": opts.id + "Needle"});
  }
  const data = JSON.parse(document.getElementById("case-data").textContent);
  dial(document.querySelector("[data-node=speedDial]"), document.querySelector("[data-node=speedScale]"),
       {id: "speed", value: data.speed.value, max: 240, minor: 10, major: 20, labelStep: 1});
  dial(document.querySelector("[data-node=rpmDial]"), document.querySelector("[data-node=rpmScale]"),
       {id: "rpm", value: data.rpm.value, max: 8, minor: 0.5, major: 1, labelStep: 1, redline: data.rpm.redline});
})();
</script>
